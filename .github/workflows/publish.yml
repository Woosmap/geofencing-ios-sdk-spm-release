name: publish Geofencing SDK on SPM and carthage
on:
  repository_dispatch:
    types: [spm]

permissions:
  contents: write

jobs:

  onSPM:
    runs-on: macos-latest
    steps:
      - name: Set framework and version
        run: |
          echo "FRAMEWORK_NAME=WoosmapGeofencing" >> $GITHUB_ENV
          echo "NEW_VERSION=${{ github.event.client_payload.v }}" >> $GITHUB_ENV

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Download artifact zip
        run: |
          curl -L -H "Authorization: token $GH_TOKEN" \
            -o $RUNNER_TEMP/artifact.zip \
            https://api.github.com/repos/Woosmap/geofencing-enterprise-ios-sdk/actions/artifacts/${{ github.event.client_payload.artifact_id }}/zip

          curl -L -H "Authorization: token $GH_TOKEN" \
              -o $RUNNER_TEMP/$FRAMEWORK_NAME.xcframework.zip \
              https://api.github.com/repos/Woosmap/geofencing-enterprise-ios-sdk/actions/artifacts/${{ github.event.client_payload.sdk_artifact_id }}/zip
        env:
          GH_TOKEN: ${{ secrets.WOOSMAP_GITHUB_TOKEN }}

      - name: Unzip artifact and restructure
        run: |
          unzip $RUNNER_TEMP/artifact.zip -d $RUNNER_TEMP/artifact
          unzip $RUNNER_TEMP/$FRAMEWORK_NAME.xcframework.zip -d $RUNNER_TEMP/artifact/$FRAMEWORK_NAME.xcframework
          cd $RUNNER_TEMP/artifact
          rm $RUNNER_TEMP/$FRAMEWORK_NAME.xcframework.zip
          zip -r $RUNNER_TEMP/$FRAMEWORK_NAME.xcframework.zip $FRAMEWORK_NAME.xcframework
  
      - name: Calculate checksum
        id: checksum
        run: |
          echo "Calculating checksum..."
          NEW_CHECKSUM=$(swift package compute-checksum ${ARCHIVE})
          echo "NEW_CHECKSUM=$NEW_CHECKSUM" >> $GITHUB_ENV
          echo "New checksum is $NEW_CHECKSUM"
        env:
          ARCHIVE: ${{ runner.temp }}/${{ env.FRAMEWORK_NAME }}.xcframework.zip

      - name: Checkout default branch (dynamic)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Update Package.swift
        run: |
          echo "Replacing module name in Package.swift..."
          sed -E -i '' 's/let moduleName = ".+"/let moduleName = "'"$FRAMEWORK_NAME"'"/' Package.swift

          echo "Replacing version in Package.swift..."
          sed -E -i '' 's/let version = ".+"/let version = "'"$NEW_VERSION"'"/' Package.swift

          echo "Replacing checksum in Package.swift..."
          sed -E -i '' 's/let checksum = ".*"/let checksum = "'"$NEW_CHECKSUM"'"/' Package.swift
        

          echo "Updating  $FRAMEWORK_NAME.json..."
          DISTRIBUTION_REPO=https://github.com/${{ github.repository }}
          sed -E -i '' '1s/.*/\{\n\t"'$NEW_VERSION'\" : \"'${DISTRIBUTION_REPO////\\/}'\/releases\/download\/'$NEW_VERSION'\/${{ env.FRAMEWORK_NAME }}.xcframework.zip?raw=true\",/' $FRAMEWORK_NAME.json


      - name: Commit and push changes
        run: |
          git config user.name  "release-bot[bot]"
          git config user.email "release-bot[bot]@users.noreply.github.com"
          git add Package.swift "${FRAMEWORK_NAME}.json"
          git commit -m "[AUTO] Update checksum and version for ${NEW_VERSION}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Create Git tag
        run: |
          git tag ${NEW_VERSION}
          git push origin ${NEW_VERSION}

      
      - name: Check
        run: |
          cat $RUNNER_TEMP/artifact/WHATSNEW.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.client_payload.v }}
          body_path: ${{ runner.temp }}/artifact/WHATSNEW.md
          files: ${{ runner.temp }}/${{ env.FRAMEWORK_NAME }}.xcframework.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
